name: release

# Cuts a client-test release from main: checks it is ready, tags main's head
# v<version>-client-test, and runs build.yml on that tag, which builds the
# installers and publishes the GitHub release.
#
# This fork (akreao/ragnarokoffline.app) cuts test builds for its own testers.
# Its tags, release titles and installer names all carry "client-test" so they
# are never mistaken for Flux159's releases, and its release notes live in
# release-notes/client-test/ so they never collide with upstream's in a merge.
#
# The version bump lands first, as an ordinary pull request whose commit is
# named "<version>" and changes only package.json and adds
# release-notes/client-test/<version>.md: main takes nothing but merged pull
# requests. This workflow never commits; it only tags. build.yml publishes the
# release with those notes.
#
# Only the fork's maintainer may run it. Anyone with write access can start a
# workflow_dispatch, so the first step stops every other actor. The scheduled
# cloud routines act as the maintainer's account and pass that check.
#
# A tag pushed with GITHUB_TOKEN does not start tag-push workflows, so
# build.yml is dispatched on the tag explicitly. Its release job keys on
# refs/tags/v*, and a dispatch on a tag ref has exactly that ref.
#
# dry_run (the default) runs every check and stops before the tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. 1.5.1 (main's package.json must already say it)
        required: true
        type: string
      dry_run:
        description: Check only; do not tag or build
        type: boolean
        default: true

permissions:
  contents: write # push the tag
  actions: write # dispatch build.yml

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}-client-test
    steps:
      - name: Only the maintainer releases
        run: |
          if [ "${{ github.actor }}" != "akreao" ]; then
            echo "::error::release.yml was started by ${{ github.actor }}; only akreao may release."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: The version is newer than the last client-test
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.5.1"; exit 1
          fi
          git fetch --tags --force --quiet
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists"; exit 1
          fi
          # Only this fork's own releases count. Upstream's version numbers jump
          # when its bumps are merged in, so the rule is "newer", not "next".
          last=$(git tag -l 'v*-client-test' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-client-test$' | head -1 || true)
          if [ -z "$last" ]; then
            echo "first client-test release: $TAG"; exit 0
          fi
          prev="${last#v}"; prev="${prev%-client-test}"
          newest=$(printf '%s\n%s\n' "$prev" "$VERSION" | sort -V | tail -1)
          if [ "$VERSION" = "$prev" ] || [ "$newest" != "$VERSION" ]; then
            echo "::error::$VERSION is not newer than the last client-test release $last"; exit 1
          fi
          echo "last release $last, releasing $TAG"

      - name: main says this version, and nothing is waiting since
        run: |
          set -euo pipefail
          have=$(node -p "require('./package.json').version")
          if [ "$have" != "$VERSION" ]; then
            echo "::error::main's package.json is $have. Merge the \"$VERSION\" bump pull request first."; exit 1
          fi
          last=$(git tag -l 'v*-client-test' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-client-test$' | head -1 || true)
          if [ -n "$last" ] && [ -z "$(git log --oneline "$last..HEAD" -- . ':!package.json' ':!release-notes')" ]; then
            echo "::error::nothing but the version changed since $last"; exit 1
          fi

      - name: main has this version's release notes
        run: |
          set -euo pipefail
          # build.yml publishes the release with this file, so the release is
          # right from the start and nothing has to edit it afterwards. It
          # comes in with the version bump pull request.
          file="release-notes/client-test/$VERSION.md"
          if [ ! -f "$file" ]; then
            echo "::error::main has no $file. Add the release notes to the \"$VERSION\" bump pull request."; exit 1
          fi
          last=$(git tag -l 'v*-client-test' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-client-test$' | head -1 || true)
          # The first client-test release has nothing to compare against.
          if [ -n "$last" ] && ! grep -qF "compare/$last...$TAG" "$file"; then
            echo "::error::$file does not end with the Full Changelog link compare/$last...$TAG"; exit 1
          fi
          echo "$file: $(wc -c < "$file") bytes"

      - name: main's own CI passed
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 40); do
            run=$(gh run list -R "$GITHUB_REPOSITORY" -w test.yml -b main -c "$sha" -L 1 --json status,conclusion -q '.[0] // empty | "\(.status) \(.conclusion)"')
            case "$run" in
              "completed success") echo "test.yml passed on $sha"; exit 0 ;;
              completed*) echo "::error::test.yml on main's head ended: $run"; exit 1 ;;
            esac
            echo "test.yml on $sha: ${run:-not started}; waiting"; sleep 30
          done
          echo "::error::test.yml did not finish on $sha"; exit 1

      - name: The server images are main's, and fresh
        run: |
          set -euo pipefail
          # The paths images.yml rebuilds on. Keep in step with its on.push.paths.
          img=$(git log -1 --first-parent --format=%H -- containers .github/workflows/images.yml \
            tests/integration/mariadb-secrets.py config/PACKETVERS scripts/packetvers.sh third-party \
            scripts/apply-server-mods.sh scripts/apply-crash-trace.py config/VENDOR_PINS)
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w images.yml -b main -L 20 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != 0 ]; then
            echo "::error::an images.yml run is still going; wait for it (or cancel the stale ones)"; exit 1
          fi
          # The newest run built from a commit that contains $img. A push of
          # several commits runs images.yml once, on the last of them, so the
          # run's head is often a later commit than $img and not $img itself.
          run=""
          while read -r sha conclusion created; do
            if git merge-base --is-ancestor "$img" "$sha" 2>/dev/null; then
              run="$conclusion $created"; break
            fi
          done < <(gh run list -R "$GITHUB_REPOSITORY" -w images.yml -b main -L 40 --json headSha,conclusion,createdAt \
            -q '.[] | "\(.headSha) \(.conclusion) \(.createdAt)"')
          if [ -z "$run" ]; then echo "::error::no images.yml run for ${img:0:9}"; exit 1; fi
          read -r conclusion started <<<"$run"
          if [ "$conclusion" != success ]; then
            echo "::error::images.yml for ${img:0:9} ended $conclusion"; exit 1
          fi
          stale=$(gh release view images -R "$GITHUB_REPOSITORY" --json assets \
            -q "[.assets[] | select((.name | startswith(\"images-\")) and .updatedAt < \"$started\") | .name] | join(\", \")")
          if [ -n "$stale" ]; then
            echo "::error::older than the images.yml run for ${img:0:9}: $stale"; exit 1
          fi
          echo "images from ${img:0:9}, published after $started"

      - name: Tag and build
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$VERSION client-test" HEAD
          git push origin "$TAG"
          gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Tagged $TAG at $(git rev-parse --short HEAD) and started build.yml on it."

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: echo "Dry run, every check passed. Run again with dry_run off to tag $TAG and build it."
